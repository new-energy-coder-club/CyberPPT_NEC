name: Mirror to Gitee & AtomGit

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee (CyberPPT_NEC)
        run: |
          REMOTE="https://darrenpig:${{ secrets.GITEE_TOKEN }}@gitee.com/darrenpig/CyberPPT_NEC.git"
          git push --force "$REMOTE" "refs/remotes/origin/*:refs/heads/*" "refs/tags/*:refs/tags/*"

      - name: Push to AtomGit (CyberPPT_NEC)
        run: |
          REMOTE="https://Darrenpig:${{ secrets.ATOMGIT_TOKEN }}@atomgit.com/cnec/CyberPPT_NEC.git"
          git push --force "$REMOTE" "refs/remotes/origin/*:refs/heads/*" "refs/tags/*:refs/tags/*"
